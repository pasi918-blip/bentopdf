name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          BASE_URL: /bentopdf/
      - name: Add web app files (manifest, service worker, icons)
        run: |
          python3 - <<'PYEOF'
          import base64, glob, os, re, json
          dist = "dist"
          os.makedirs(dist + "/images", exist_ok=True)
          open(dist + "/images/icon-192.png", "wb").write(base64.b64decode(""))
          open(dist + "/images/icon-512.png", "wb").write(base64.b64decode(""))
          manifest = {
            "name": "BentoPDF",
            "short_name": "BentoPDF",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#111111",
            "theme_color": "#111111",
            "icons": [
              {"src": "images/icon-192.png", "sizes": "192x192", "type": "image/png"},
              {"src": "images/icon-512.png", "sizes": "512x512", "type": "image/png"}
            ]
          }
          open(dist + "/manifest.webmanifest", "w").write(json.dumps(manifest, indent=2))
          open(dist + "/sw.js", "w").write(
            "self.addEventListener('install', () => self.skipWaiting());\n"
            "self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));\n"
            "self.addEventListener('fetch', () => {});\n"
          )
          head = '<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#111111">'
          body = "<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}</script>"
          for f in glob.glob(dist + "/*.html"):
              html = open(f, encoding="utf-8").read()
              if "manifest.webmanifest" in html:
                  continue
              html = re.sub(r"<head[^>]*>", lambda m: m.group(0) + head, html, count=1)
              html = html.replace("</body>", body + "</body>", 1)
              open(f, "w", encoding="utf-8").write(html)
          print("done")
          PYEOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
